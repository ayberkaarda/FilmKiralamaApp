<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Dark backdrop of the screens: the tone of the original plain background with a soft light from the top left and a faint film strip along the bottom. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262634"/>
      <stop offset="0.6" stop-color="#20202b"/>
      <stop offset="1" stop-color="#1b1b24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#3a3350" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#20202b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="holes" x="0" y="0" width="64" height="72" patternUnits="userSpaceOnUse">
      <rect x="20" y="10" width="24" height="16" rx="4" fill="#20202b"/>
      <rect x="20" y="46" width="24" height="16" rx="4" fill="#20202b"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <g opacity="0.35">
    <rect x="0" y="1008" width="1920" height="72" fill="#2c2c3c"/>
    <rect x="0" y="1008" width="1920" height="72" fill="url(#holes)"/>
  </g>
</svg>
